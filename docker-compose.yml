services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: toya_amerta_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    networks:
      - toya_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  webserver:
    image: nginx:alpine
    container_name: toya_amerta_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - toya_network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: toya_amerta_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-toya_amerta}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-toya_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - toya_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: toya_amerta_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - toya_network

  vite:
    image: node:22-alpine
    container_name: toya_amerta_vite
    working_dir: /var/www
    volumes:
      - .:/var/www
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    networks:
      - toya_network
    profiles:
      - dev

networks:
  toya_network:
    driver: bridge

volumes:
  db_data:
    driver: local
